[project]
name = "icev-remote-sensing-software"
version = "0.1.0"
description = "Remote sensing platform for Sentinel-2 imagery analysis"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.32.0",
    "rasterio>=1.4.0",
    "numpy>=2.0.0",
    "shapely>=2.0.0",
    "pillow>=10.0.0",
    "python-multipart>=0.0.9",
    "pyproj>=3.6.0",
    "scipy>=1.13.0",
    "scikit-learn>=1.5.0",
    "scikit-image>=0.24.0",
    "opencv-python>=4.10.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "httpx>=0.27.0",
    "python-pptx>=1.0.2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
addopts = "-v --tb=short"
